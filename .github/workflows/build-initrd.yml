name: Build Initrd and Final Archive


on:
  workflow_dispatch:
    inputs:
      run-id:
        description: 'Идентификатор запуска'
        required: true
        default: ''


  workflow_run:
    workflows: ["Build Armbian Kernel for QEMU aarch64"]
    types: [completed]


jobs:
  build-initrd:
    runs-on: ubuntu-latest
    steps:
      - name: Download Kernel Artifacts
        uses: actions/download-artifact@v4
        with:
          name: armbian-kernel
          path: temp/kernel-artifacts
          run-id: ${{ github.event.workflow_run.id || github.event.inputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}


      - name: Unpack artifacts
        run: |
          ls -lR temp/
          unzip temp/kernel-artifacts/armbian-kernel.zip


      - name: Create chroot
        run: |
          mkdir -p debian-chroot
          mkdir -p ./debian-chroot/debs
          mkdir -p ./debian-chroot/images

          cp -Rv ./build/output/debs/linux-image-*.deb ./debian-chroot/debs


          debootstrap stable debian-chroot http://deb.debian.org/debian

          mount -t proc proc  debian-chroot/proc
          mount -t sysfs sys  debian-chroot/sys
          mount -o bind /dev  debian-chroot/dev/
          mount -t devpts devpts  debian-chroot/dev/pts


      - name: Create mkinitramfs.sh
        run: |
          cat >./debian-chroot/mkinitramfs.sh <<EOF
          set -x
          apt install -y initramfs-tools
          KERNEL_VER=$(dpkg-deb -f /debs/linux-image-*.deb Armbian-Kernel-Version)-current-arm64
          dpkg-deb -x debs/linux-image-*.deb /
          mkinitramfs  -o /images/initrd.img-$KERNEL_VER $KERNEL_VER
          EOF

      - name: Create initrd
        run: |
          chroot debian-chroot /bin/bash mkinitramfs.sh
          mv ./debian-chroot/images ./build/output/

      - name: Delete chroot
        run: |
          umount debian-chroot/proc
          umount debian-chroot/sys
          umount debian-chroot/dev/pts
          umount debian-chroot/dev/

          rm -rf debian-chroot/*


      - name: Extract vmlinuz and DTB
        run: |
          cd build/output/
          mkdir ./debs/extracted
          dpkg-deb -x ./debs/linux-image-*.deb ./debs/extracted/
          dpkg-deb -x ./debs/linux-dtb-*.deb ./debs/extracted/


      - name: Pack vmlinuz, DTB and initrd
        run: |
          cd build/output/
          KERNEL_VER=$(dpkg-deb -f output/debs/linux-image-*.deb Armbian-Kernel-Version)

          if [ -z "$KERNEL_VER" ]; then
          echo "Error: Armbian-Kernel-Version not found in deb package!"
          exit 1
          fi
          echo "Detected kernel version: $KERNEL_VER"

          cd ./debs/extracted/boot/
          tar cvf $GITHUB_WORKSPACE/build/output/images/linux-image-$KERNEL_VER.tar.gz *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: armbian-kernel
          path: |
            #build/output/images/vmlinuz-*
            #build/output/images/dtb-*/*.dtb
            #build/output/images/modules-*.tgz
            #build/output/debs/*.deb

            build/output/images/linux-image.tar.gz

            if-no-files-found: error
